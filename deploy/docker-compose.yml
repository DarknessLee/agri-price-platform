# 农产品价格监测预测分析平台 —— 数据服务与基础设施编排
# 说明：本机若已运行具备同等端口的 MySQL / Redis 容器，可直接复用，无需启动本编排。
# 启动：docker compose -f deploy/docker-compose.yml up -d
# 连接：MySQL 127.0.0.1:13306（agri / Agri_2026 / agri_price）
#       Redis 127.0.0.1:16379（密码 DataSec_2026）
#       MinIO 127.0.0.1:9000（agri / Agri_2026_minio，控制台 9001）
#       Mailpit 127.0.0.1:1025（SMTP）/ 8025（Web 收件箱）

name: agri-price-platform

services:
  agri-mysql:
    image: mysql:8.0
    container_name: agri-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: "DataSec_root_2026"
      MYSQL_DATABASE: "agri_price"
      MYSQL_USER: "agri"
      MYSQL_PASSWORD: "Agri_2026"
    ports:
      - "13306:3306"
    volumes:
      - agri-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pDataSec_root_2026"]
      interval: 5s
      timeout: 5s
      retries: 30

  agri-redis:
    image: redis:7-alpine
    container_name: agri-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "DataSec_2026"]
    ports:
      - "16379:6379"
    volumes:
      - agri-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "DataSec_2026", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  agri-minio:
    image: minio/minio:latest
    container_name: agri-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "agri"
      MINIO_ROOT_PASSWORD: "Agri_2026_minio"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - agri-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30

  agri-mailpit:
    image: axllent/mailpit:latest
    container_name: agri-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "500"
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  agri-mysql-data:
    name: agri-price-platform_agri-mysql-data
  agri-redis-data:
    name: agri-price-platform_agri-redis-data
  agri-minio-data:
    name: agri-price-platform_agri-minio-data
